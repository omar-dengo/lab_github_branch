name: Check images
on:
  pull_request:
    paths: ['./**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check filenames are lowercase letters only
        run: |
          bad=0
          for f in ./*; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            if [[ ! "$name" =~ ^[a-z]+\.(jpg|png)$ ]]; then
              echo "::error::Bad filename: $name (lowercase letters only, no caps, no numbers, no spaces, then .png)"
              bad=1
            fi
          done
          exit $bad
