name: Check images
on:
  pull_request:

jobs:
  check_name01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check filenames are lowercase letters only
        run: |
          bad=0
          while IFS= read -r f; do
            name=$(basename "$f")
            if [[ ! "$name" =~ ^[a-z]+\.(jpg|png)$ ]]; then
              echo "::error::Bad filename: $name (lowercase letters only, no caps, no numbers, no spaces, then .jpg or .png)"
              bad=1
            fi
          done < <(find . -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -not -path './.git/*')
          exit $bad
